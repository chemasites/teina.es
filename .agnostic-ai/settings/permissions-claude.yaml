target: claude
permissions:
    allow:
        - shell(zola build:*)
        - shell(zola serve:*)
        - shell(zola check:*)
        - shell(ls:*)
        - shell(du:*)
        - shell(cat:*)
        - shell(file:*)
        - shell(wc:*)
        - shell(sips:*)
        - shell(cwebp:*)
        - shell(identify:*)
        - shell(open:*)
        - shell(git add:*)
        - shell(git commit:*)
        - shell(git status:*)
        - shell(git log:*)
        - shell(git diff:*)
        - shell(git branch:*)
        - shell(git checkout:*)
        - shell(git switch:*)
        - shell(git stash:*)
        - shell(git tag:*)
        - shell(git push:*)
        - shell(git pull:*)
        - shell(git fetch:*)
        - shell(git reset:*)
        - shell(gh pr:*)
        - shell(gh issue:*)
        - shell(gh run:*)
        - shell(echo:*)
        - shell(mkdir:*)
        - shell(cp:*)
        - shell(mv:*)
        - read(content/**)
        - read(data/**)
        - read(sass/**)
        - read(scripts/**)
        - read(static/**)
        - read(templates/**)
        - read(zola.toml)
        - edit(content/**)
        - edit(data/**)
        - edit(sass/**)
        - edit(scripts/**)
        - edit(static/**)
        - edit(templates/**)
        - edit(zola.toml)
        - Glob
        - Grep
        - WebFetch
    deny:
        - shell(git push --force:*)
        - shell(git push -f:*)
        - shell(git push origin +*)
        - shell(git reset --hard:*)
        - shell(git clean -f:*)
        - shell(git checkout .:*)
        - shell(git restore .:*)
        - shell(rm -rf:*)
