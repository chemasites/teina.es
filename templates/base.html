<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.title }}{% endblock %}</title>
    <meta name="description" content="{{ config.description }}">

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ config.base_url }}">
    <meta property="og:title" content="{{ config.title }} - Indie Pop Rock">
    <meta property="og:description" content="{{ config.description }}">
    <meta property="og:image" content="{{ get_url(path='imgs/teina-logo.png') }}">
    <meta property="og:locale" content="es_ES">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ config.title }} - Indie Pop Rock">
    <meta name="twitter:description" content="{{ config.description }}">
    <meta name="twitter:image" content="{{ get_url(path='imgs/teina-logo.png') }}">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ get_url(path='imgs/favicon.png') }}">
    <link rel="apple-touch-icon" href="{{ get_url(path='imgs/teina-logo.png') }}">

    <!-- Styles -->
    <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
</head>
<body>
    {% block content %}{% endblock %}

    <script>
        // Navbar scroll effect
        const navbar = document.querySelector('.navbar');
        if (navbar) {
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            });
        }

        // Fade-in on scroll
        const fadeElements = document.querySelectorAll('.fade-in');
        const fadeObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });

        fadeElements.forEach(el => fadeObserver.observe(el));

        // Lightbox
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.querySelector('.lightbox-img');
        const lightboxClose = document.querySelector('.lightbox-close');

        document.querySelectorAll('[data-lightbox]').forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                lightboxImg.src = item.href;
                lightboxImg.alt = item.querySelector('img')?.alt || '';
                lightbox.classList.add('active');
                document.body.style.overflow = 'hidden';
            });
        });

        if (lightboxClose) {
            lightboxClose.addEventListener('click', closeLightbox);
        }
        if (lightbox) {
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightbox?.classList.contains('active')) {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
