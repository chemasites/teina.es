<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <script>
        // Prevent flash of wrong theme - runs before page renders
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.title }} | {% if lang == "en" %}Indie Pop Rock Band in Calasparra, Murcia{% else %}Banda de Indie Pop Rock en Calasparra, Murcia{% endif %}{% endblock %}</title>
    <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
    <meta name="keywords" content="{% if lang == 'en' %}Teína, band, music, indie pop rock, Calasparra, Murcia, musical group, covers, concerts, events, festivals, booking{% else %}Teína, banda, música, indie pop rock, Calasparra, Murcia, grupo musical, versiones, conciertos, eventos, festivales, contratación{% endif %}">
    <meta name="author" content="Teína">
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">
    <link rel="canonical" href="{% block canonical %}{{ config.base_url }}{% if lang == 'en' %}/en{% endif %}{% endblock %}">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:url" content="{% block og_url %}{{ config.base_url }}{% if lang == 'en' %}/en{% endif %}{% endblock %}">
    <meta property="og:title" content="{% block og_title %}{{ config.title }} | {% if lang == 'en' %}Indie Pop Rock Band{% else %}Banda de Indie Pop Rock{% endif %}{% endblock %}">
    <meta property="og:description" content="{% block og_description %}{{ config.description }}{% endblock %}">
    <meta property="og:image" content="{{ get_url(path='imgs/teina-logo.png') }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="{% if lang == 'en' %}en_US{% else %}es_ES{% endif %}">
    <meta property="og:site_name" content="Teína">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}{{ config.title }} | {% if lang == 'en' %}Indie Pop Rock Band{% else %}Banda de Indie Pop Rock{% endif %}{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}{{ config.description }}{% endblock %}">
    <meta name="twitter:image" content="{{ get_url(path='imgs/teina-logo.png') }}">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ get_url(path='imgs/favicon.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ get_url(path='imgs/favicon.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ get_url(path='imgs/teina-logo.png') }}">

    <!-- Language alternatives -->
    {% set current_path = current_path | default(value="/") %}
    <link rel="alternate" hreflang="es" href="{{ config.base_url }}{{ current_path | replace(from="/en/", to="/") | replace(from="/en", to="") }}">
    <link rel="alternate" hreflang="en" href="{{ config.base_url }}/en{{ current_path | replace(from="/en/", to="/") | replace(from="/en", to="") }}">
    <link rel="alternate" hreflang="x-default" href="{{ config.base_url }}{{ current_path | replace(from="/en/", to="/") | replace(from="/en", to="") }}">

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://www.google.com">

    <!-- Styles -->
    <link rel="stylesheet" href="{{ get_url(path='style.css') }}">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "MusicGroup",
        "name": "Teína",
        "description": "{{ config.description }}",
        "url": "{{ config.base_url }}",
        "logo": "{{ get_url(path='imgs/teina-logo.png') }}",
        "image": "{{ get_url(path='imgs/teina-logo.png') }}",
        "genre": ["Indie Pop", "Pop Rock", "Rock"],
        "foundingLocation": {
            "@type": "Place",
            "name": "Calasparra, Murcia, España"
        },
        "areaServed": {
            "@type": "Country",
            "name": "España"
        },
        "sameAs": [
            "https://instagram.com/teinaband",
            "https://www.youtube.com/watch?v=XDiUv8ba55I"
        ],
        "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+34-661-892-704",
            "contactType": "booking",
            "availableLanguage": "Spanish"
        },
        "member": [
            {
                "@type": "Person",
                "name": "Juanjo",
                "roleName": "Guitarra y Voz"
            },
            {
                "@type": "Person",
                "name": "Jose Antonio",
                "roleName": "Teclados"
            },
            {
                "@type": "Person",
                "name": "Adrián",
                "roleName": "Batería"
            },
            {
                "@type": "Person",
                "name": "Antonio",
                "roleName": "Bajo"
            },
            {
                "@type": "Person",
                "name": "Nacho",
                "roleName": "Saxos y Percusión"
            }
        ]
    }
    </script>
    {% block extra_schema %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}

    <script>
        // Navbar scroll effect
        const navbar = document.querySelector('.navbar');
        if (navbar) {
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            });
        }

        // Fade-in on scroll
        const fadeElements = document.querySelectorAll('.fade-in');
        const fadeObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });

        fadeElements.forEach(el => fadeObserver.observe(el));

        // Lightbox
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.querySelector('.lightbox-img');
        const lightboxClose = document.querySelector('.lightbox-close');

        document.querySelectorAll('[data-lightbox]').forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                lightboxImg.src = item.href;
                lightboxImg.alt = item.querySelector('img')?.alt || '';
                lightbox.classList.add('active');
                document.body.style.overflow = 'hidden';
            });
        });

        if (lightboxClose) {
            lightboxClose.addEventListener('click', closeLightbox);
        }
        if (lightbox) {
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightbox?.classList.contains('active')) {
                closeLightbox();
            }
        });

        // Theme toggle functionality
        const themeToggle = document.getElementById('theme-toggle');

        function getSystemTheme() {
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function getCurrentTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) return savedTheme;
            return getSystemTheme();
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        }

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const currentTheme = getCurrentTheme();
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                setTheme(newTheme);
            });
        }

        // Listen for system theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            // Only auto-switch if user hasn't set a preference
            if (!localStorage.getItem('theme')) {
                document.documentElement.removeAttribute('data-theme');
            }
        });
    </script>
</body>
</html>
