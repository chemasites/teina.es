{% set lang_prefix = "" %}
{% if lang == "en" %}
    {% set lang_prefix = "/en" %}
{% endif %}

<nav class="navbar">
    <a href="{{ lang_prefix }}/" class="nav-logo">
        <img src="{{ get_url(path='imgs/mariposa-teina.jpg') }}" alt="Teína" loading="lazy">
    </a>
    <ul class="nav-links">
        {% if lang == "en" %}
        <li><a href="{{ lang_prefix }}/banda/">Band</a></li>
        <li><a href="{{ lang_prefix }}/musica/">Music</a></li>
        <li><a href="{{ lang_prefix }}/media/">Media</a></li>
        <li><a href="{{ lang_prefix }}/contacto/">Contact</a></li>
        {% else %}
        <li><a href="/banda/">Banda</a></li>
        <li><a href="/musica/">Musica</a></li>
        <li><a href="/media/">Media</a></li>
        <li><a href="/contacto/">Contacto</a></li>
        {% endif %}
        <li class="lang-switcher">
            {% if lang == "en" %}
            <a href="/" title="Español">ES</a>
            {% else %}
            <a href="/en/" title="English">EN</a>
            {% endif %}
        </li>
        <li class="theme-toggle">
            <button id="theme-toggle" aria-label="{% if lang == 'en' %}Toggle dark mode{% else %}Cambiar modo oscuro{% endif %}">
                <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </li>
    </ul>
</nav>
