{% set lang_prefix = "" %}
{% if lang == "en" %}
    {% set lang_prefix = "/en" %}
{% endif %}

<nav class="navbar">
    <a href="{{ lang_prefix }}/" class="nav-logo">
        <img src="{{ get_url(path='imgs/mariposa-teina.jpg') }}" alt="Teína" loading="lazy">
    </a>
    <ul class="nav-links">
        {% if lang == "en" %}
        <li><a href="{{ lang_prefix }}/banda/">Band</a></li>
        <li><a href="{{ lang_prefix }}/musica/">Music</a></li>
        <li><a href="{{ lang_prefix }}/media/">Media</a></li>
        <li><a href="{{ lang_prefix }}/contacto/">Contact</a></li>
        {% else %}
        <li><a href="/banda/">Banda</a></li>
        <li><a href="/musica/">Musica</a></li>
        <li><a href="/media/">Media</a></li>
        <li><a href="/contacto/">Contacto</a></li>
        {% endif %}
        <li class="lang-switcher">
            {% if lang == "en" %}
            <a href="/" title="Español">ES</a>
            {% else %}
            <a href="/en/" title="English">EN</a>
            {% endif %}
        </li>
    </ul>
</nav>
