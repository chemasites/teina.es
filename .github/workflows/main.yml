on:
  push:
    branches: [main]
  workflow_dispatch:

name: Build and deploy GH Pages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.6

      - name: Check with Zola
        run: zola check

      - name: Build with Zola
        run: zola build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # IndexNow tells Bing, Yandex and other engines which URLs changed; a failure never blocks the deploy
      - name: Notify IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: 29295bd0b0a311ecd2ef8f38cb7f87ab
        run: |
          urls=$(curl -fsS https://teina.es/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc .)
          body=$(jq -nc --arg key "$INDEXNOW_KEY" --argjson urls "$urls" '{host: "teina.es", key: $key, keyLocation: ("https://teina.es/" + $key + ".txt"), urlList: $urls}')
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body"
